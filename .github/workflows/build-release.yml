# CI 打包与发布 —— EXE(NSIS) + MSIX，全部在 GitHub 完成，本地禁止打包
#
# 触发：push main / 打 v* tag / 手动（重跑命中 npm 与 rust 缓存，不重复装依赖）
# 产物（文件名全部 ASCII，踩坑 #29：softprops 上传会吞掉中文文件名前缀）：
#   1. <slug>_<版本>_x64-setup.exe —— NSIS 安装包，直接分发
#   2. <slug>-<版本>-x64.msix —— 微软商店提交用（免签名，商店代签）
#   3. msix-conformance.txt —— MSIX 合规自检报告（闸门 G1）
#
# 三道 MSIX 闸门（未过闸门不产生 Release）：
#   G0 源码侧拦截 scripts/package-msix.ps1（清单 EntryPoint / 别名 / 图标尺寸 / 语言）
#   G1 产物解包合规 scripts/verify-msix.ps1（清单身份 / 版本 / 资源 / 载荷依赖）
#   G2 AUMID 实机激活 scripts/msix-activation-selftest.ps1（复刻认证启动路径）
name: build-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 本机低配不装依赖、不跑校验：typecheck + i18n 全部上移到这里，红即停
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 安装前端依赖
        run: npm ci
      - name: 前端校验（typecheck + i18n）
        run: npm run preflight

  windows-exe-msix:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      # 图标生成：本地只复制 app-icon.png（纯文件操作），全套图标在这里生成
      - name: 生成图标（如提供 app-icon.png）
        shell: powershell
        run: |
          if (Test-Path "src-tauri/icons/app-icon.png") {
            npx tauri icon src-tauri/icons/app-icon.png
          } else {
            Write-Host "no app-icon.png, keep existing icons"
          }

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 读取版本号与 ASCII 产物名
        shell: bash
        run: |
          echo "APP_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
          echo "PRODUCT_NAME=$(jq -r '.productName' src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
          # 中文产品名不能直接进 Release 文件名（softprops 会丢掉非 ASCII 前缀，踩坑 #29）：
          # 默认取 identifier 末段（如 com.ziyoukaifazhe.yijiankoutuwang -> yijiankoutuwang）兜底，
          # Agent 想用更好读的 ASCII slug 时直接改下面这一行的赋值即可。
          echo "APP_SLUG=$(jq -r '.identifier' src-tauri/tauri.conf.json | awk -F. '{print $NF}')" >> "$GITHUB_ENV"

      # 同时产出：NSIS 安装包（bundle/nsis/*-setup.exe）与原始 exe（MSIX 载荷）
      - name: 构建（NSIS 安装包 + 原始 exe）
        run: npx tauri build --bundles nsis

      # 启动冒烟：直接运行 release exe，10 秒不退出才算过。
      # 抓的是启动期 panic / 缺依赖；注意它抓不到「清单 EntryPoint 非法」那类缺陷
      # （直接跑 exe 会绕过激活流程，永远正常）—— 那类由 G2 AUMID 激活自检负责。
      # exe 名不硬编码：按体积自动发现（踩坑 #19）
      - name: 启动冒烟测试（防启动期 panic）
        shell: powershell
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "release exe not found under src-tauri/target/release" }
          Write-Host "smoke exe: $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            throw "app exited at launch (code $($proc.ExitCode)) - startup panic, see AGENT.md pit #22"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "launch smoke: PASS (process alive after 10s)"

      # G0：免签名 MSIX（清单含商店产品标识 + 专属执行别名 + 图标/语言硬校验）
      - name: 打包 MSIX（商店标识，免签名）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-msix.ps1

      # G1：解包合规自检（报告 target/msix-conformance.txt，FAIL 即整跑失败）
      - name: MSIX 合规自检（闸门 G1）
        shell: powershell
        run: |
          $msix = Get-ChildItem "target/msix" -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "msix not found under target/msix" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-msix.ps1 -MsixPath $msix.FullName -OutFile "target/msix-conformance.txt"
          if ($LASTEXITCODE -ne 0) { throw "MSIX conformance gate FAILED - see target/msix-conformance.txt" }

      # G2：AUMID 实机激活（上传商店前唯一能复刻认证启动路径的检查）
      # 退出码 0 = 出现可见主窗口；1 = 起不来（认证必报 10.1.2.10）；2 = 本 runner 装不了（告警放行）
      - name: AUMID 激活自检（闸门 G2）
        shell: powershell
        run: |
          $msix = Get-ChildItem "target/msix" -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "msix not found under target/msix" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/msix-activation-selftest.ps1 -MsixPath $msix.FullName
          switch ($LASTEXITCODE) {
            0 { Write-Host "activation selftest: PASS (visible main window)" }
            2 { Write-Host "::warning::activation selftest SKIPPED - this runner cannot sideload MSIX; verify locally before submitting" }
            default { throw "activation selftest FAILED (exit $LASTEXITCODE) - Store cert 10.1.2.10 class; check AppxManifest EntryPoint" }
          }

      # 产物整理：全部重命名为 ASCII（踩坑 #29）
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/${APP_SLUG}_${APP_VERSION}_x64-setup.exe" 2>/dev/null || \
            cp src-tauri/target/release/bundle/nsis/*.exe "out/${APP_SLUG}_${APP_VERSION}_x64-setup.exe"
          cp target/msix/*.msix "out/${APP_SLUG}-${APP_VERSION}-x64.msix"
          cp target/msix-conformance.txt "out/msix-conformance.txt"
          ls -lh out

      - name: 生成校验和
        shell: bash
        working-directory: out
        run: sha256sum * > checksums.sha256

      # 直接发布 Release，不保留 artifact（避免免费存储超标）
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ${{ env.PRODUCT_NAME }} v${{ env.APP_VERSION }}
          body: |
            自动构建（commit ${{ github.sha }}）

            - `${{ env.APP_SLUG }}_${{ env.APP_VERSION }}_x64-setup.exe` —— Windows x64 安装包，下载后直接运行
            - `${{ env.APP_SLUG }}-${{ env.APP_VERSION }}-x64.msix` —— 微软商店提交包（免签名，上传至 Partner Center 后由微软签名）
            - `msix-conformance.txt` —— MSIX 合规自检报告（闸门 G1 结果）

            MSIX 三道闸门：G0 打包拦截 / G1 解包合规 / G2 AUMID 实机激活，结果见构建日志与上方报告。

            首次运行未签名 exe 可能被 SmartScreen 提示，点「更多信息 → 仍要运行」即可。
          files: |
            out/*
