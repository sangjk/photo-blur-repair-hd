[package]
name = "base-window"
version = "1.0.0"
description = "通用桌面软件窗口外壳（Vue 3 + Tauri 2）"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "base_window_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘必需；image-ico/image-png：解码 .ico/.png 图标必需
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
# V免签 API 转发：支付下单/查询/关闭改为由 Rust 侧发起，绕过 WebView/浏览器 CORS 限制。
# default-features = false + default-tls：不引入 native-tls（否则 Windows 上会链接失败/体积膨胀）
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
# 系统保存对话框：导出时让用户选择保存位置（不写死下载目录）
tauri-plugin-dialog = "2"

# Release：更小体积 + 更快启动（Tauri 桌面应用通用优化）
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
